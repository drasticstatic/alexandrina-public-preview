<style>
:root{--ink:#0d0a08;--fg:#f6ecdf;--muted:#d8c4ac;--ember:#ff6b1a;--amber:#ffb347;--honey:#ffd08a;--flame:#ff3d00;--velvet:#3a0d06;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:hidden}
body{background:var(--ink);color:var(--fg);font:17px/1.6 "Space Grotesk",system-ui,sans-serif;overflow-x:hidden}
a{color:var(--honey)}
/* her face: breathing and glowing (transform/opacity only, so the GPU does the work) */
.vision{position:fixed;inset:0;z-index:0;overflow:hidden;background:var(--ink);clip-path:circle(0% at 50% 34%);transition:clip-path 2.6s cubic-bezier(.65,0,.2,1)}

.aura{position:absolute;left:50%;top:34%;width:160vmax;height:160vmax;margin:-80vmax 0 0 -80vmax;z-index:1;pointer-events:none;opacity:.22;mix-blend-mode:screen;will-change:transform;

  background:repeating-linear-gradient(90deg,rgba(255,61,0,0) 0,rgba(255,107,26,.42) 2.2%,rgba(255,179,71,.30) 4.4%,rgba(167,139,250,.30) 6.6%,rgba(34,211,238,.20) 8.8%,rgba(255,61,0,0) 11%);
  -webkit-mask:linear-gradient(to bottom,transparent,#000 18%,#000 72%,transparent);mask:linear-gradient(to bottom,transparent,#000 18%,#000 72%,transparent);

.veil::after{content:"";position:absolute;left:50%;top:38%;width:120vmax;height:120vmax;margin:-60vmax 0 0 -60vmax;opacity:.35;will-change:transform;
  background:conic-gradient(from 0deg,transparent,rgba(255,107,26,.6),transparent 22%,rgba(167,139,250,.5),transparent 45%,rgba(255,179,71,.55),transparent 70%,rgba(34,211,238,.35),transparent);
  -webkit-mask:radial-gradient(closest-side,#000,transparent 70%);mask:radial-gradient(closest-side,#000,transparent 70%);animation:veilspin 18s linear infinite}

.veil i{position:absolute;inset:-10% -25%;will-change:transform;mix-blend-mode:screen;opacity:.55;
  background:repeating-linear-gradient(96deg,transparent 0,rgba(255,208,138,.35) 1.1%,transparent 2.4%,rgba(192,132,252,.28) 3.6%,transparent 4.8%);

.answers a:hover{border-color:var(--amber);box-shadow:0 0 24px rgba(255,107,26,.35)}
@keyframes rise{to{opacity:1;transform:none}}
.behind{margin-top:2.2rem;font-size:.85rem;color:var(--muted);text-shadow:0 1px 10px #000}
.behind a{color:var(--muted)}
.letter{position:fixed;z-index:30;pointer-events:none;font:600 1rem "Space Grotesk",sans-serif;color:var(--honey);text-shadow:0 0 10px var(--ember);animation:ascend 1.4s ease-out forwards}
@keyframes ascend{to{transform:translate(var(--dx),-180px) scale(.4);opacity:0}}
.sr{position:absolute;left:-9999px}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
@media (max-width:560px){.top nav a{font-size:.8rem;padding:.3rem .45rem}.mark{font-size:1.2rem}}
@media (prefers-reduced-motion:reduce){.vision img,.glow,.aura{animation:none}.veil,.spirits{display:none}.vision{clip-path:none;transition:none}}
</style>

function answer(q){q=(q||'').toLowerCase();var w=q.split(/[^a-z0-9]+/).filter(function(s){return s.length>2});
  var crisis=/crisis|suicid|kill|hurt myself|988|emergency/.test(q);
  var hit=crisis?[SHELVES[10]]:SHELVES.map(function(s){var n=0;w.forEach(function(v){if(s.k.indexOf(v)>=0)n+=2;else if(v.length>4&&s.k.indexOf(v.slice(0,4))>=0)n++});return{s:s,n:n}})
    .filter(function(h){return h.n>0}).sort(function(a,b){return b.n-a.n}).slice(0,3).map(function(h){return h.s});
  var found=hit.length>0;if(!found)hit=[SHELVES[0],SHELVES[2],SHELVES[4]];
  var line=crisis?'Please reach a human voice now: call or text 988 in the US, or your local emergency number.':found?'Ah. I think you were looking for this.':VOICE[Math.floor(Math.random()*VOICE.length)];
  var box=document.getElementById('answers');box.innerHTML='';
  say(line,function(){hit.forEach(function(s,i){var a=document.createElement('a');a.href=s.u;a.style.animationDelay=(i*.15)+'s';a.innerHTML='<i class="ph-fill ph-'+s.i+'"></i> '+s.l;box.appendChild(a)})})}
/* your words rise as embers */
function dissolve(input){if(reduce)return;var r=input.getBoundingClientRect(),text=input.value.slice(0,60);
  for(var i=0;i<text.length;i++){var s=document.createElement('span');s.className='letter';s.textContent=text[i];s.style.left=(r.left+16+i*9)+'px';s.style.top=(r.top+r.height/2-10)+'px';
    s.style.setProperty('--dx',((Math.random()-.5)*120)+'px');s.style.animationDelay=(i*12)+'ms';document.body.appendChild(s);setTimeout(s.remove.bind(s),1800+i*12)}}
var intro;
document.getElementById('ask').addEventListener('submit',function(e){e.preventDefault();clearTimeout(intro);var q=document.getElementById('q');dissolve(q);var v=q.value;q.value='';answer(v)});
/* a lost visitor gets a guess from the address they tried */
intro=setTimeout(function(){
  if(visit){var tried='';try{tried=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||'')}catch(e){}answer(tried.replace(/\.html?$/,'').replace(/[-_]/g,' '))}
  else say('Ask me where you meant to go, and I\'ll light the way.');
},reduce?0:1700);
})();
</script>
