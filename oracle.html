<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Oracle · Alexandrina</title>
<meta name="description" content="Lost in the library? Ask Alexandrina where you meant to go.">
<meta name="theme-color" content="#0d0a08">
<link rel="icon" type="image/png" sizes="64x64" href="https://drasticstatic.github.io/alexandrina-public-preview/assets/favicon-64.png">
<meta property="og:image" content="https://drasticstatic.github.io/alexandrina-public-preview/assets/social.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/fill/style.css">
<style>
:root{--ink:#0d0a08;--fg:#f6ecdf;--muted:#d8c4ac;--ember:#ff6b1a;--amber:#ffb347;--honey:#ffd08a;--flame:#ff3d00;--velvet:#3a0d06;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--ink);color:var(--fg);font:17px/1.6 "Space Grotesk",system-ui,sans-serif;overflow-x:hidden}
a{color:var(--honey)}
/* her face: breathing, flowing, glowing */
.vision{position:fixed;inset:-4%;z-index:0;overflow:hidden}
.vision img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;filter:url(#warp) saturate(1.15) brightness(.95);animation:breathe 9s ease-in-out infinite;transform-origin:50% 40%}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
.glow{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(40% 35% at 50% 32%,rgba(255,170,90,.3),transparent 70%);mix-blend-mode:screen;animation:pulse 9s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.veil{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(120% 90% at 50% 35%,transparent 35%,rgba(13,10,8,.55) 70%,rgba(13,10,8,.95)),linear-gradient(to bottom,transparent 45%,rgba(13,10,8,.92) 82%)}
#sparks{position:fixed;inset:0;z-index:2;pointer-events:none}
/* the curtain parts */
.curtain{position:fixed;top:0;bottom:0;width:51%;z-index:20;pointer-events:none;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.35) 0 6px,transparent 6px 46px,rgba(255,120,60,.08) 46px 52px,transparent 52px 92px),linear-gradient(180deg,#5a1508,var(--velvet) 60%,#1a0503);
  box-shadow:inset 0 0 80px rgba(0,0,0,.8);transition:transform 2.6s cubic-bezier(.7,0,.2,1)}
.curtain.l{left:0}.curtain.r{right:0}
.open .curtain.l{transform:translateX(-102%)}.open .curtain.r{transform:translateX(102%)}
/* nav */
.top{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:1rem;padding:.9rem 1.4rem;background:linear-gradient(to bottom,rgba(13,10,8,.8),transparent)}
.mark{display:flex;align-items:center;gap:.55rem;color:var(--fg);text-decoration:none;font:400 1.45rem "Instrument Serif",serif}
.mark img{width:28px;height:28px;border-radius:50%;box-shadow:0 0 16px rgba(255,107,26,.6)}
.top nav{margin-left:auto;display:flex;gap:.2rem;flex-wrap:wrap;justify-content:flex-end}
.top nav a{color:var(--muted);text-decoration:none;font-size:.9rem;padding:.35rem .65rem;border-radius:8px}
.top nav a:hover,.top nav a[aria-current]{color:var(--fg);background:rgba(255,255,255,.08)}
/* her voice */
main{position:relative;z-index:5;min-height:100vh;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center;padding:8rem 1rem 3.5rem}
.eyebrow{font:600 .72rem "JetBrains Mono",monospace;letter-spacing:.3em;text-transform:uppercase;color:var(--amber);text-shadow:0 0 12px rgba(0,0,0,.9)}
h1{font:400 clamp(2.6rem,8vw,5.6rem)/.95 "Instrument Serif",serif;margin:.6rem 0 .8rem;text-shadow:0 0 40px rgba(255,107,26,.45),0 2px 18px rgba(0,0,0,.9)}
h1 em{font-style:italic;background:linear-gradient(100deg,var(--honey),var(--ember),var(--flame));-webkit-background-clip:text;background-clip:text;color:transparent}
.speak{font:italic 400 clamp(1.15rem,2.2vw,1.45rem)/1.6 "Instrument Serif",serif;max-width:40rem;min-height:3.2em;margin:0 auto 1.6rem;color:var(--fg);text-shadow:0 1px 14px rgba(0,0,0,.95)}
.speak .caret{display:inline-block;width:2px;height:1em;background:var(--amber);vertical-align:-.1em;margin-left:2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
form{display:flex;gap:.5rem;width:min(620px,100%);margin:0 auto;padding:.4rem;border-radius:999px;background:rgba(20,12,8,.72);border:1px solid rgba(255,160,90,.35);backdrop-filter:blur(10px);box-shadow:0 0 50px rgba(255,107,26,.25)}
form input{flex:1;min-width:0;background:transparent;border:0;outline:none;color:var(--fg);font:500 1rem "Space Grotesk",sans-serif;padding:.7rem 1rem}
form input::placeholder{color:rgba(216,196,172,.65)}
form button{border:0;border-radius:999px;padding:.7rem 1.2rem;font:700 .95rem "Space Grotesk",sans-serif;color:#1a0d04;background:linear-gradient(120deg,var(--flame),var(--ember) 50%,var(--amber));cursor:pointer;white-space:nowrap}
form:focus-within{border-color:var(--amber)}
.answers{display:flex;flex-wrap:wrap;justify-content:center;gap:.6rem;margin:1.3rem auto 0;max-width:46rem;min-height:2.8rem}
.answers a{display:inline-flex;align-items:center;gap:.45rem;padding:.65rem 1.05rem;border-radius:12px;text-decoration:none;color:var(--fg);background:rgba(25,15,10,.75);border:1px solid rgba(255,160,90,.3);backdrop-filter:blur(8px);opacity:0;transform:translateY(8px);animation:rise .6s forwards}
.answers a:hover{border-color:var(--amber);box-shadow:0 0 24px rgba(255,107,26,.35)}
@keyframes rise{to{opacity:1;transform:none}}
.behind{margin-top:2.2rem;font-size:.85rem;color:var(--muted);text-shadow:0 1px 10px #000}
.behind a{color:var(--muted)}
.letter{position:fixed;z-index:30;pointer-events:none;font:600 1rem "Space Grotesk",sans-serif;color:var(--honey);text-shadow:0 0 10px var(--ember);animation:ascend 1.4s ease-out forwards}
@keyframes ascend{to{transform:translate(var(--dx),-180px) scale(.4);opacity:0}}
.sr{position:absolute;left:-9999px}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
@media (max-width:560px){.top nav a{font-size:.8rem;padding:.3rem .45rem}.mark{font-size:1.2rem}}
@media (prefers-reduced-motion:reduce){.vision img,.glow{animation:none;filter:saturate(1.15)}.curtain{display:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="warp" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence id="turb" type="fractalNoise" baseFrequency="0.006 0.012" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="18" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<div class="vision" aria-hidden="true"><img src="https://drasticstatic.github.io/alexandrina-public-preview/assets/oracle.webp?v=2" alt=""></div>
<div class="glow" aria-hidden="true"></div><div class="veil" aria-hidden="true"></div>
<canvas id="sparks" aria-hidden="true"></canvas>
<div class="curtain l" aria-hidden="true"></div><div class="curtain r" aria-hidden="true"></div>

<header class="top">
  <a class="mark" href="https://drasticstatic.github.io/alexandrina-public-preview/"><img src="https://drasticstatic.github.io/alexandrina-public-preview/assets/favicon-64.png" alt="" width="28" height="28">Alexandrina</a>
  <nav aria-label="Sections">
    <a href="https://drasticstatic.github.io/alexandrina-public-preview/#flow">Pipeline</a>
    <a href="https://drasticstatic.github.io/alexandrina-public-preview/#flagship">A.L.E.X.</a>
    <a href="https://drasticstatic.github.io/alexandrina-public-preview/oracle.html" aria-current="page"><i class="ph-fill ph-eye"></i> Oracle</a>
  </nav>
</header>

<main>
  <div class="eyebrow" id="eyebrow">The Oracle</div>
  <h1>You've wandered <em>beyond the shelves.</em></h1>
  <p class="speak" id="speak" aria-live="polite"></p>
  <form id="ask" autocomplete="off">
    <label class="sr" for="q">Ask Alexandrina where you meant to go</label>
    <input id="q" placeholder="Ask me where you meant to go…" maxlength="120">
    <button type="submit"><i class="ph-fill ph-sparkle"></i> Ask</button>
  </form>
  <div class="answers" id="answers"></div>
  <p class="behind"><i class="ph-fill ph-eye"></i> Pay no attention to the <a href="https://drasticstatic.github.io/alexandrina-public-preview/#flow">engine behind the curtain</a>.</p>
</main>

<script>
(function(){
var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,X='https://drasticstatic.github.io/alexandrina-public-preview/',A='https://psychedelicsinrecovery.github.io/alex-desk-public/';
var visit=!/\/(oracle|404)\.html$/.test(location.pathname);
document.getElementById('eyebrow').textContent=visit?'404 · The Oracle':'The Oracle';
setTimeout(function(){document.body.classList.add('open')},reduce?0:350);
/* the vision flows */
var turb=document.getElementById('turb');
if(!reduce&&turb)(function flow(t){turb.setAttribute('baseFrequency',(0.006+Math.sin(t/4200)*0.0022).toFixed(4)+' '+(0.012+Math.cos(t/5300)*0.003).toFixed(4));requestAnimationFrame(flow)})(0);
/* rising embers */
var c=document.getElementById('sparks'),x=c.getContext('2d'),W,H,P=[],dpr=Math.min(devicePixelRatio||1,2);
function size(){W=c.width=innerWidth*dpr;H=c.height=innerHeight*dpr;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px'}
function sp(any){return{x:W*(.2+Math.random()*.6),y:any?Math.random()*H:H+8,vy:-(.2+Math.random()*.6)*dpr,s:Math.random()*6.28,r:(Math.random()*1.5+.4)*dpr}}
size();addEventListener('resize',size);for(var i=0;i<90;i++)P.push(sp(true));
function draw(t){x.clearRect(0,0,W,H);x.globalCompositeOperation='lighter';
  P.forEach(function(p,i){p.y+=p.vy;p.x+=Math.sin(t*.001+p.s)*.3*dpr;if(p.y<-8)P[i]=sp(false);var a=Math.max(0,Math.min(1,(H-p.y)/H*1.5));
    var g=x.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*4);g.addColorStop(0,'rgba(255,170,90,'+a+')');g.addColorStop(1,'rgba(255,107,26,0)');x.fillStyle=g;x.beginPath();x.arc(p.x,p.y,p.r*4,0,6.283);x.fill()});
  if(!reduce)requestAnimationFrame(draw)}
requestAnimationFrame(draw);
/* her voice */
var speak=document.getElementById('speak'),typing;
function say(text,done){clearInterval(typing);speak.innerHTML='';var i=0,span=document.createElement('span'),caret=document.createElement('span');caret.className='caret';speak.appendChild(span);speak.appendChild(caret);
  if(reduce){span.textContent=text;caret.remove();if(done)done();return}
  typing=setInterval(function(){span.textContent=text.slice(0,++i);if(i>=text.length){clearInterval(typing);setTimeout(function(){caret.remove()},1200);if(done)done()}},28)}
var SHELVES=[
 {k:'home start alexandrina engine about index',l:'Alexandrina home',u:X,i:'flame'},
 {k:'library libraries tenant tenants community communities shelf shelves',l:'One engine, many libraries',u:X+'#libraries',i:'books'},
 {k:'pipeline flow how works search answer safety fusion retrieval',l:'The pipeline',u:X+'#flow',i:'tree-structure'},
 {k:'yaml config configure setup new community folder',l:'A new community is a folder',u:X+'#tenant',i:'file-code'},
 {k:'alex pir flagship discord helper',l:'A.L.E.X. at PIR®',u:A,i:'planet'},
 {k:'map sitemap everything pages lost',l:'A.L.E.X. site map',u:A+'map.html',i:'map-trifold'},
 {k:'ticket help person desk helpdesk support email web portal',l:'The web helpdesk',u:A+'portal.html',i:'ticket'},
 {k:'roadmap future next plans',l:'Where it\'s headed',u:X+'#road',i:'compass'},
 {k:'poem alexandrine verse twelve lantern',l:'An alexandrine',u:A+'#poem',i:'feather'},
 {k:'privacy data stored',l:'Privacy',u:A+'privacy.html',i:'lock-key'},
 {k:'crisis emergency 988 hurt danger',l:'Crisis resources',u:'https://www.psychedelicsinrecovery.org/crisis-resources/',i:'lifebuoy'}];
var VOICE=['The shelves rearranged themselves, but I remember where things are.','Every question lands somewhere. This one just needs a different shelf.','You were never lost, only between pages.','What you seek is near. Follow the light.'];
function answer(q){q=(q||'').toLowerCase();var w=q.split(/[^a-z0-9]+/).filter(function(s){return s.length>2});
  var crisis=/crisis|suicid|kill|hurt myself|988|emergency/.test(q);
  var hit=crisis?[SHELVES[10]]:SHELVES.map(function(s){var n=0;w.forEach(function(v){if(s.k.indexOf(v)>=0)n+=2;else if(v.length>4&&s.k.indexOf(v.slice(0,4))>=0)n++});return{s:s,n:n}})
    .filter(function(h){return h.n>0}).sort(function(a,b){return b.n-a.n}).slice(0,3).map(function(h){return h.s});
  var found=hit.length>0;if(!found)hit=[SHELVES[0],SHELVES[2],SHELVES[4]];
  var line=crisis?'Please reach a human voice now: call or text 988 in the US, or your local emergency number.':found?'Ah. I think you were looking for this.':VOICE[Math.floor(Math.random()*VOICE.length)];
  var box=document.getElementById('answers');box.innerHTML='';
  say(line,function(){hit.forEach(function(s,i){var a=document.createElement('a');a.href=s.u;a.style.animationDelay=(i*.15)+'s';a.innerHTML='<i class="ph-fill ph-'+s.i+'"></i> '+s.l;box.appendChild(a)})})}
/* your words rise as embers */
function dissolve(input){if(reduce)return;var r=input.getBoundingClientRect(),text=input.value.slice(0,60);
  for(var i=0;i<text.length;i++){var s=document.createElement('span');s.className='letter';s.textContent=text[i];s.style.left=(r.left+16+i*9)+'px';s.style.top=(r.top+r.height/2-10)+'px';
    s.style.setProperty('--dx',((Math.random()-.5)*120)+'px');s.style.animationDelay=(i*12)+'ms';document.body.appendChild(s);setTimeout(s.remove.bind(s),1800+i*12)}}
document.getElementById('ask').addEventListener('submit',function(e){e.preventDefault();var q=document.getElementById('q');dissolve(q);var v=q.value;q.value='';answer(v)});
/* a lost visitor gets a guess from the address they tried */
setTimeout(function(){
  if(visit){var tried='';try{tried=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||'')}catch(e){}answer(tried.replace(/\.html?$/,'').replace(/[-_]/g,' '))}
  else say('Ask me where you meant to go, and I\'ll light the way.');
},reduce?0:1700);
})();
</script>
</body>
</html>
